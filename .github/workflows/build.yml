name: Build and Deploy

on:
  push:
    branches:
      - main
      - tech_challenge
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: oficina-api
  TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD || 'oficina_pass' }}

jobs:
  lint-and-format:
    name: Lint e Formatação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências de dev
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests scripts

      - name: Black check
        run: black --check src tests scripts

  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Executar testes unitários
        run: pytest tests/unit/ -q
        env:
          SECRET_KEY: ci-secret-key-para-testes-32-chars-ok

  integration-tests:
    name: Testes de Integração
    runs-on: ubuntu-latest
    needs: lint-and-format

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina_user
          POSTGRES_PASSWORD: oficina_pass
          POSTGRES_DB: oficina_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Criar banco de testes
        run: |
          python - <<'EOF'
          import pg8000.native, time
          for _ in range(10):
              try:
                  conn = pg8000.native.Connection('oficina_user', password='oficina_pass', host='localhost', port=5432, database='oficina_db')
                  conn.run('CREATE DATABASE oficina_test')
                  conn.close()
                  break
              except Exception:
                  time.sleep(2)
          EOF

      - name: Executar testes de integração
        run: pytest tests/integration/ -q
        env:
          DATABASE_URL: postgresql+pg8000://oficina_user:oficina_pass@localhost:5432/oficina_db
          TEST_DATABASE_URL: postgresql+pg8000://oficina_user:oficina_pass@localhost:5432/oficina_test
          SECRET_KEY: ci-secret-key-para-testes-32-chars-ok

  coverage-and-sonar:
    name: Cobertura e SonarQube
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina_user
          POSTGRES_PASSWORD: oficina_pass
          POSTGRES_DB: oficina_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Criar banco de testes
        run: |
          python - <<'EOF'
          import pg8000.native, time
          for _ in range(10):
              try:
                  conn = pg8000.native.Connection('oficina_user', password='oficina_pass', host='localhost', port=5432, database='oficina_db')
                  conn.run('CREATE DATABASE oficina_test')
                  conn.close()
                  break
              except Exception:
                  time.sleep(2)
          EOF

      - name: Executar testes com cobertura
        run: pytest tests/ --cov=src --cov-report=xml:coverage.xml --cov-fail-under=80 -q
        env:
          DATABASE_URL: postgresql+pg8000://oficina_user:oficina_pass@localhost:5432/oficina_db
          TEST_DATABASE_URL: postgresql+pg8000://oficina_user:oficina_pass@localhost:5432/oficina_test
          SECRET_KEY: ci-secret-key-para-testes-32-chars-ok

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build-push:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: coverage-and-sonar
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform Plan/Apply
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    environment: production

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file=environments/local.tfvars -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Configurar kubeconfig gerado pelo Terraform
        run: |
          mkdir -p ~/.kube
          cp kubeconfig ~/.kube/config

      - name: Aplicar manifestos Kubernetes
        run: kubectl apply -f ../k8s/

      - name: Aguardar rollout da API
        run: kubectl rollout status deployment/oficina-api -n oficina-api --timeout=180s

      - name: Aplicar Job de migrations
        run: kubectl apply -f ../k8s/job-migrate.yaml

      - name: Aguardar conclusão do Job
        run: kubectl wait --for=condition=complete job/oficina-api-migrate -n oficina-api --timeout=180s



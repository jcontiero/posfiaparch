[project]
name = "oficina-api"
version = "0.2.0"
description = "Sistema Integrado de Atendimento e Execução de Serviços - FIAP Pos Tech"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pg8000>=1.30",
    "pydantic-settings>=2.0",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pyright>=1.1",
    "ruff>=0.6",
    "black>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
omit = ["src/migrations/*", "alembic/*"]

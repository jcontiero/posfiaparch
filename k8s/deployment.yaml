apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina-api
  labels:
    app: oficina-api
    tier: api
    env: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: oficina-api
      tier: api
  template:
    metadata:
      labels:
        app: oficina-api
        tier: api
        env: production
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: api
          image: oficina-api:v0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: oficina-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secret
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secret
                  key: SECRET_KEY
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secret
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secret
                  key: SMTP_PASSWORD
            - name: ADMIN_SENHA
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secret
                  key: ADMIN_SENHA
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

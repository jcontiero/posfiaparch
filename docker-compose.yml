services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oficina_db
      POSTGRES_USER: oficina_user
      POSTGRES_PASSWORD: oficina_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina_user -d oficina_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+pg8000://oficina_user:oficina_pass@db:5432/oficina_db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@oficina.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-senha123}
      SECRET_KEY: ${SECRET_KEY:-chave-secreta-dev-troque-em-producao-minimo-32-chars}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

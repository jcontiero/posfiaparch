# Padrao de credenciais do PostgreSQL (mesmo usuario/senha/banco usado no .env.example)
# - Aplicacao no Docker usa host 'db'; dev local usa 'localhost'
name: oficina-api

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oficina_db
      POSTGRES_USER: oficina_user
      POSTGRES_PASSWORD: oficina_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina_user -d oficina_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oficina-network

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+pg8000://oficina_user:oficina_pass@db:5432/oficina_db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@oficina.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-senha123}
      SECRET_KEY: ${SECRET_KEY:-chave-secreta-dev-troque-em-producao-minimo-32-chars}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - oficina-network

  # Servico opcional para aplicar migrations do Alembic.
  # Requer que o alembic.ini e as revisions existam no projeto.
  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+pg8000://oficina_user:oficina_pass@db:5432/oficina_db
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    profiles:
      - tools
    networks:
      - oficina-network

  # Servico opcional para popular dados iniciais.
  seed:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+pg8000://oficina_user:oficina_pass@db:5432/oficina_db
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "scripts/seed.py"]
    profiles:
      - tools
    networks:
      - oficina-network

volumes:
  postgres_data:

networks:
  oficina-network:
    driver: bridge
